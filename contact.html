<!DOCTYPE html>
<html lang="en">
<head>
    <title>North Star Bakery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact</a>
    </nav>
 <main id="primary">
    <h1>Contact Us</h1>
 </main>

<form action="/submit-contact" method="post">
    
    <fieldset class="information">
    <legend>Your Information</legend>

        <div>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Jessie" minlength="3" maxlength="20" required>
        </div>
    
        <div>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="James" minlength="3" maxlength="20" required>
        </div>
    
        <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="JJames@gmail.com" required>   
        </div>
    
    </fieldset>

<fieldset class="request">
    <legend>Your Request</legend>
    <div>
        <label for="pickup">Pick Up Date</lable>
        <input type="date" id="pickup">
    </div>

    <div>
        <p>Request Type:</p>
        <label>
        <input type="radio" name="request" value="Pre-Order"> Pre-Order
        </label>

        <label>
        <input type="radio" name="request" value="General Inquiry"> General Inquiry
        </label>
    </div>

    <div> 
         <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" cols="40">
        </textarea>
    </div>  

      <div> 
        <label for="allergies">Allergies</label>
        <textarea id="allergies" name="allergies" rows="5" cols="40"></textarea>
    </div>  
</fieldset>
    <div>
        <input type="submit">
        <input type="reset">
    </div>

</form>

<p>Contact information</p>

</body>

</ul>
</nav>
</footer>

</html>
